<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Portfolio</title>
    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #000; /* black background */
            color: #fff; /* white text */
            padding: 2rem;
        }

        /* Intro */
        .intro {
            text-align: center;
            margin-top: 7rem; /* headroom */
            margin-bottom: 7rem; /* spacing below intro */
        }

        .intro h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .intro p {
            font-size: 1.2rem;
            color: #ccc;
        }

        /* Projects grid */
        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            justify-content: center; /* center the grid */
            max-width: 1000px; /* overall grid width */
            margin: 0 auto;
        }

        .project {
            display: flex;
            flex-direction: column;
            background-color: #111; /* dark grey box */
            border-radius: 8px;
            overflow: hidden;
            max-width: 400px; /* individual box max width */
            margin: 0 auto; /* center box if fewer than grid columns */
        }

        .project-image {
            width: 100%;
            height: 400px;
            overflow: hidden;
        }

        .project-image img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* crop to square/fit nicely */
        }

        .project-info {
            padding: 1rem;
        }

        .project-info h3 {
            margin-bottom: 0.5rem;
            font-size: 1.2rem;
            color: #fff;
        }

        .project-info p {
            margin-bottom: 1rem;
            color: #ccc;
        }

        .project-info a {
            color: #000;
            background-color: #fff;
            padding: 0.5rem 1rem;
            text-decoration: none;
            border-radius: 5px;
            font-size: 0.9rem;
        }

        .project-info a:hover {
            background-color: #ccc;
        }

        /* Responsive tweaks */
        @media (max-width: 600px) {
            body {
                padding: 1rem;
            }

            .projects {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Intro -->
    <div class="intro">
